<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Git DevOps Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-size: 0.9rem; }
        .terminal-box { background-color: #010409; border: 1px solid #30363d; font-family: monospace; font-size: 0.75rem; height: 130px; overflow-y: auto; color: #39ff14; box-shadow: inset 0 0 8px rgba(0,0,0,0.6); }
        .chat-box { height: calc(100vh - 430px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        /* Gaya Dasar Chat Bubble */
        .bubble { padding: 10px 14px; border-radius: 12px; max-width: 85%; word-wrap: break-word; color: #ffffff !important; }
        .bubble.user { background-color: #1f6feb; color: white; align-self: flex-end; }
        
        /* Memaksa Teks Bubble AI menjadi Putih Terang Bersinar */
        .bubble.ai { 
            background-color: #21262d; 
            border: 1px solid #444c56; 
            align-self: flex-start; 
            color: #ffffff !important; 
        }
        
        .bubble.ai * {
            color: #ffffff !important;
        }

        .action-btn { font-weight: bold; font-size: 0.8rem; text-transform: uppercase; margin-top: 8px; display: inline-block; }
        .custom-textarea { background-color: #1f242c !important; color: #ffffff !important; border: 1px solid #444c56 !important; }
        .custom-textarea:focus { border-color: #58a6ff !important; box-shadow: 0 0 0 0.2rem rgba(88,166,255,0.25) !important; }
        .custom-textarea::placeholder { color: #8b949e !important; }
        
        /* Gaya Kotak Khusus Danger Zone */
        .danger-zone-box {
            background-color: #1c1012 !important;
            border: 1px solid #da3633 !important;
            color: #ff7b72 !important;
        }
    </style>
</head>
<body class="p-2">
    <div class="container-fluid p-0">
        <header class="text-center py-2 border-bottom border-secondary mb-2">
            <h1 class="h6 text-primary m-0 fw-bold">🤖 AI DEVOPS GIT AGENT</h1>
        </header>

        <div class="card bg-dark border-secondary mb-2">
            <div class="card-header py-1 text-warning fw-bold small text-uppercase" style="font-size: 0.65rem;">📡 Cloud Pipeline Monitor</div>
            <div class="card-body p-2">
                <div class="terminal-box p-2 rounded" id="terminalLog">
                    <div>[SYSTEM] Core Pipeline Initialization Successful.</div>
                </div>
            </div>
        </div>

        <div class="card bg-dark border-secondary mb-2">
            <div class="card-body p-2 chat-box" id="chatHistory">
                <div class="bubble ai">Hello Master! Provide your GitLab Token below, then ask me to create, modify, or delete repositories.</div>
            </div>
        </div>

        <div class="card bg-dark border-secondary p-2">
            <div class="mb-2">
                <label for="gitlabPatInput" class="form-label text-warning small fw-bold text-uppercase m-0" style="font-size: 0.65rem;">🔑 Your GitLab Access Token (PAT)</label>
                <input type="password" class="form-control custom-textarea py-1" id="gitlabPatInput" style="font-size: 0.8rem;" placeholder="glpat-...">
            </div>
            <div class="input-group">
                <textarea class="form-control custom-textarea" id="userInput" rows="2" placeholder="Ask me anything..."></textarea>
                <button class="btn btn-success fw-bold text-white px-3" type="button" onclick="kirimPesan()">SEND</button>
            </div>
        </div>
    </div>

    <script>
        // 🔥 GANTI INI SESUAI ID PROYEK FIREBASE BARUMU YANG AKTIF
        const PROJECT_ID = "atas-garis";

        const isLocal = window.location.hostname.includes('localhost') || window.location.hostname.includes('127.0.0.1');
        
        // Router Pintar Otomatis: Jika di emulator pakai port 5001, jika di web pakai URL aslinya
        const BASE_URL = isLocal 
            ? `http://localhost:5001/${PROJECT_ID}/us-central1/api`
            : `https://us-central1-${PROJECT_ID}.cloudfunctions.net/api`;

        const URL_CHAT = `${BASE_URL}/chat`;
        const URL_DELETE = `${BASE_URL}/execute-delete`;

        const chatHistory = document.getElementById('chatHistory');
        const terminalLog = document.getElementById('terminalLog');

        function appendLog(text, isAlert = false) {
            const row = document.createElement('div');
            row.style.color = isAlert ? '#ff7b72' : '#39ff14';
            row.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            terminalLog.appendChild(row);
            terminalLog.scrollTop = terminalLog.scrollHeight;
        }

        async function kirimPesan() {
            const userInput = document.getElementById('userInput');
            const gitlabToken = document.getElementById('gitlabPatInput').value.trim();
            const text = userInput.value.trim();
            if (!text) return;

            // Render Bubble User
            const userBubble = document.createElement('div');
            userBubble.className = 'bubble user';
            userBubble.innerText = text;
            chatHistory.appendChild(userBubble);
            userInput.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            appendLog(`Processing instruction token stream...`);

            try {
                const response = await fetch(URL_CHAT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pesanUser: text, tokenUserGitLab: gitlabToken })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const resData = await response.json();

                // Render Bubble Balasan AI
                const aiBubble = document.createElement('div');
                aiBubble.className = 'bubble ai';
                aiBubble.innerHTML = `<div>${resData.jawabanAI}</div>`;
                chatHistory.appendChild(aiBubble);

                // --- EVALUASI LOGIKA PERINTAH DEVOPS ---
                if (resData.status === 'SUKSES_BUAT') {
                    appendLog(`✨ SUCCESS: Project provisioned on GitLab!`);
                    const btn = document.createElement('a');
                    btn.className = 'btn btn-sm btn-outline-info action-btn d-block text-center';
                    btn.href = resData.detail.urlWeb;
                    btn.target = '_blank';
                    btn.innerText = '📂 Inspect Repository';
                    aiBubble.appendChild(btn);
                } 
                // 🔥 KEMBALIKAN FITUR HAPUS YANG HILANG DI SINI
                else if (resData.status === 'MENUNGGU_KONFIRMASI_HAPUS') {
                    const repoTarget = resData.detail.namaRepo;
                    appendLog(`⚠️ SECURITY CHALLENGE: Destructive intent caught on [${repoTarget}]`, true);
                    
                    const btnDiv = document.createElement('div');
                    btnDiv.className = 'mt-3 p-3 danger-zone-box rounded text-start';
                    btnDiv.innerHTML = `
                        <div class="text-light fw-bold small mb-2">⚠️ DANGER ZONE AUTHORIZATION REQUIRED</div>
                        <div class="small mb-3" style="font-size: 0.75rem; color: #c9d1d9 !important;">
                            Are you absolutely sure you want to permanently delete repository <span class="text-warning fw-bold">${repoTarget}</span>?
                        </div>
                    `;

                    const btnYes = document.createElement('button');
                    btnYes.className = 'btn btn-danger fw-bold btn-sm me-2 px-3';
                    btnYes.innerText = 'YES, DELETE';
                    
                    const btnNo = document.createElement('button');
                    btnNo.className = 'btn btn-secondary btn-sm px-3';
                    btnNo.innerText = 'CANCEL';

                    btnYes.onclick = async () => {
                        btnYes.disabled = true; btnNo.disabled = true;
                        appendLog(`Triggering destructive API sweep for: ${repoTarget}...`);
                        try {
                            const delRes = await fetch(URL_DELETE, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ namaRepo: repoTarget, tokenUserGitLab: gitlabToken })
                            });
                            if (!delRes.ok) throw new Error("Delete Request Failed");
                            
                            const delData = await delRes.json();
                            if (delData.status === 'SUKSES') {
                                appendLog(`💥 DESTROYED: Project purged from cloud infrastructure.`, true);
                                btnDiv.innerHTML = `<div class="text-success fw-bold small">💥 Repository successfully purged from GitLab.</div>`;
                            }
                        } catch(e) {
                            appendLog(`❌ Link disruption: ${e.message}`, true);
                        }
                    };

                    btnNo.onclick = () => { 
                        btnDiv.innerHTML = `<div class="text-info small">Operation aborted safely.</div>`;
                        appendLog(`✅ Operation aborted.`); 
                    };
                    
                    btnDiv.appendChild(btnYes); 
                    btnDiv.appendChild(btnNo);
                    aiBubble.appendChild(btnDiv);
                } 
                else if (resData.status === 'MENUNGGU_REVIEW') {
                    appendLog(`🚀 PIPELINE DEPLOYED: Review MR created.`);
                    const btn = document.createElement('a');
                    btn.className = 'btn btn-sm btn-warning action-btn d-block text-center text-dark';
                    btn.href = resData.detail.urlPersetujuan;
                    btn.target = '_blank';
                    btn.innerText = '🔍 REVIEW CODE & MERGE';
                    aiBubble.appendChild(btn);
                }
                else if (resData.status === 'TOKEN_MISSING' || resData.error) {
                    appendLog(`❌ ERROR: ${resData.status || resData.error}`, true);
                }

                chatHistory.scrollTop = chatHistory.scrollHeight;

            } catch (err) {
                appendLog(`❌ SYSTEM DIAGNOSTIC: ${err.message}`, true);
                console.error(err);
            }
        }
    </script>
</body>
</html>
